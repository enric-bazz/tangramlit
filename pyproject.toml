[project]
name = "tangramlit"
version = "0.1.0"
description = "Tangram cell-to-space mapping reimplemented in PyTorch Lightning"
readme = "README.md"
requires-python = ">=3.10"
# Lower bounds are the versions the package was developed with; exact versions live in uv.lock
dependencies = [
    "anndata>=0.11.4",
    "lightning>=2.5.5",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "optuna>=4.5.0",
    "optuna-integration[pytorch-lightning]>=4.7.0",
    "pandas>=2.2.3",
    "pyyaml>=6.0",
    "scanpy>=1.11.1",
    "scikit-learn>=1.5.2",
    "scipy>=1.15",
    "seaborn>=0.13.2",
    "squidpy>=1.6.5",
    "tensorboard>=2.20",
    "torch>=2.7",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "ipykernel>=6.29.5",
    "jupyterlab>=4.4.3",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tangramlit = "tangramlit.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

